# EarnZone — Render (Static Site)
#
# Analytics : ajouter VITE_GA_MEASUREMENT_ID dans
#   Dashboard Render > earnzone > Environment > Add Environment Variable
# (ou via ce blueprint : la variable est declaree en "sync: false",
#  ce qui veut dire : cle pre-remplie, valeur a saisir dans le Dashboard).
# La valeur n'est jamais commitee dans Git.
services:
  - type: web
    name: earnzone
    runtime: static
    buildCommand: npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_GA_MEASUREMENT_ID
        sync: false
    headers:
      - path: /*
        name: X-Frame-Options
        value: DENY
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
