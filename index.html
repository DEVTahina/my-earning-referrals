<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <script>
      // Applique le thème sauvegardé avant le premier rendu (évite le flash).
      (function () {
        try {
          var t = localStorage.getItem("earnzone-theme");
          if (!t) {
            t = window.matchMedia("(prefers-color-scheme: light)").matches
              ? "light"
              : "dark";
          }
          document.documentElement.setAttribute("data-theme", t);
        } catch (e) {
          document.documentElement.setAttribute("data-theme", "dark");
        }
      })();
    </script>

    <title>Micro-Tâches & Gagner en Ligne | EarnZone</title>
    <meta
      name="description"
      content="Découvrez différentes plateformes de micro-tâches, sondages, rewards et applications pour gagner en ligne."
    />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Micro-Tâches & Gagner en Ligne | EarnZone" />
    <meta
      property="og:description"
      content="Découvrez différentes plateformes de micro-tâches, sondages, rewards et applications pour gagner en ligne."
    />
    <meta property="og:site_name" content="EarnZone" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Micro-Tâches & Gagner en Ligne | EarnZone" />
    <meta
      name="twitter:description"
      content="Découvrez différentes plateformes de micro-tâches, sondages, rewards et applications pour gagner en ligne."
    />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
